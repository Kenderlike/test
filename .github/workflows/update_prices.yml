name: Update MM2 Prices

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка системных пакетов и Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp xvfb libgtk-3-0 libasound2t64 libx11-xcb1

          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000
          warp-cli --accept-tos connect

          for i in {1..15}; do
            if curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "WARP успешно подключен!"
              break
            fi
            sleep 2
          done

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m camoufox fetch

      - name: Запуск парсера
        env:
          # Если захочешь использовать свой приватный прокси, просто добавь секрет PROXY_URL в настройки репозитория
          PROXY_URL: ${{ secrets.PROXY_URL || 'socks5h://127.0.0.1:40000' }}
        run: python parser.py

      - name: Сохранение и пуш prices.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json meta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление цен MM2" && git push)
